name: classroom

services:
  backend:
    build:
      context: ./management-backend
      dockerfile: Dockerfile
    # loads DATABASE_URL, BETTER_AUTH_SECRET, ARCJET_KEY, PORT, etc.
    env_file:
      - ./management-backend/.env
    expose:
      - "4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./management-refine-based-frontend
      dockerfile: Dockerfile
      # Vite bakes these at build time; override via a root .env if needed.
      # "same-origin" = relative /api/... calls (nginx proxies them to backend)
      args:
        VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL:-same-origin}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-dmnu03v9k}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-classroom_app}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

# no database service needed: the app uses a hosted Neon Postgres instance
